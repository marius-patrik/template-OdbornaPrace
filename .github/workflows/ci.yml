name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    uses: marius-patrik/DarkFactory/.github/workflows/ci.yml@darkfactory
    # Pinned so the shared scripts are checked out; without a ref the job looks for them
    # in this repository, which carries none of the pipeline.
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "f0d838e891c73656952ca18bc49a8cae871dfed5"
    secrets: inherit
